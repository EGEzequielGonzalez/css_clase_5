    <h1 class="title">Contactanos</h1>
    <form action="#" class="formulario-contacto">
      <fieldset><legend>Datos personales</legend><label>Nombre <input type="text" name="nombre"></label><label>Apellido <input type="text" name="apellido"></label></fieldset>
      <label>Comentarios <textarea name="comentario" placeholder="Escribí tu comentario"></textarea></label>
      <button type="submit" class="btn btn-danger mt-3">Enviar</button>
    </form>
    <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#modalHorarios">Ver información de atención</button>
    <div class="modal fade" id="modalHorarios" tabindex="-1" aria-labelledby="modalHorariosLabel" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="modalHorariosLabel">Información de atención</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body">Contactanos para consultar nuestros horarios de atención y conocer más sobre Código Café.</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button></div></div></div></div>
